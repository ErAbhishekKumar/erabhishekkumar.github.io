<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cloud & Weather Analyzer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 1.4rem;
            text-align: center;
            color: #38bdf8;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background-color: #1e293b;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        canvas {
            display: none;
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .metric-row:last-child {
            margin-bottom: 0;
        }

        .label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .value {
            font-weight: bold;
            font-size: 1.05rem;
            color: #f1f5f9;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #0284c7);
            transition: width 0.3s ease, background 0.3s ease;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-light { background-color: #0284c7; color: white; }
        .badge-medium { background-color: #eab308; color: black; }
        .badge-heavy { background-color: #dc2626; color: white; }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <h2>☁️ Live Cloud Density & Rain Estimator</h2>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

        <div class="overlay">
            <div class="metric-row">
                <span class="label">Avg Darkness (Greyscale):</span>
                <span id="darkness-val" class="value">0%</span>
            </div>

            <div style="margin-bottom: 12px;">
                <div class="metric-row">
                    <span class="label">Water Density:</span>
                    <span id="density-val" class="value">0.00 g/m³</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="density-bar" class="progress-bar-fill"></div>
                </div>
            </div>

            <div style="margin-bottom: 12px;">
                <div class="metric-row">
                    <span class="label">Cloud Depth / Thickness:</span>
                    <span id="depth-val" class="value">0 km</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="depth-bar" class="progress-bar-fill"></div>
                </div>
            </div>

            <div>
                <div class="metric-row">
                    <span class="label">Rain Chances:</span>
                    <span id="rain-val" class="value">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="rain-bar" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="start-btn">Start Camera</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');

        const darknessVal = document.getElementById('darkness-val');
        const densityVal = document.getElementById('density-val');
        const depthVal = document.getElementById('depth-val');
        const rainVal = document.getElementById('rain-val');

        const densityBar = document.getElementById('density-bar');
        const depthBar = document.getElementById('depth-bar');
        const rainBar = document.getElementById('rain-bar');

        let isStreaming = false;

        startBtn.addEventListener('click', async () => {
            if (isStreaming) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                isStreaming = true;
                startBtn.style.display = 'none';
                requestAnimationFrame(processFrame);
            } catch (err) {
                alert("Camera access denied or unavailable: " + err.message);
            }
        });

        function processFrame() {
            if (!isStreaming) return;

            if (video.videoWidth > 0 && video.videoHeight > 0) {
                canvas.width = 160; 
                canvas.height = 120;
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;

                let totalBrightness = 0;
                let pixelCount = 0;

                // Loop through pixels to calculate average brightness
                for (let i = 0; i < data.length; i += 16) { // Sampling step of 4 pixels
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    
                    // Luminance formula
                    const brightness = (0.299 * r + 0.587 * g + 0.114 * b);
                    totalBrightness += brightness;
                    pixelCount++;
                }

                const avgBrightness = totalBrightness / pixelCount; // 0 (black) to 255 (white)
                
                // Cloud Darkness Factor (0% = Bright White, 100% = Dark Storm Cloud)
                let darknessPercent = Math.max(0, Math.min(100, ((220 - avgBrightness) / 160) * 100));

                updateMetrics(darknessPercent);
            }

            requestAnimationFrame(processFrame);
        }

        function updateMetrics(darkness) {
            // Estimates based on darkness index
            // 1. Water Content / Density (Approx 0.2 g/m³ for thin clouds to ~2.5 g/m³ for thick nimbostratus)
            const waterDensity = (0.2 + (darkness / 100) * 2.3).toFixed(2);
            
            // 2. Cloud Depth (Approx 0.5 km for thin clouds to ~8.0 km for deep rain clouds)
            const cloudDepth = (0.5 + (darkness / 100) * 7.5).toFixed(1);
            
            // 3. Rain Probability %
            let rainProbability = Math.round(Math.pow(darkness / 100, 1.2) * 100);
            if (rainProbability > 95) rainProbability = 95;

            // DOM Updates
            darknessVal.textContent = `${Math.round(darkness)}%`;
            densityVal.textContent = `${waterDensity} g/m³`;
            depthVal.textContent = `${cloudDepth} km`;
            rainVal.textContent = `${rainProbability}%`;

            // Progress Bars Updates
            densityBar.style.width = `${(waterDensity / 2.5) * 100}%`;
            depthBar.style.width = `${(cloudDepth / 8.0) * 100}%`;
            rainBar.style.width = `${rainProbability}%`;

            // Color variations based on rain risk
            if (rainProbability > 65) {
                rainBar.style.background = 'linear-gradient(90deg, #f59e0b, #ef4444)';
            } else if (rainProbability > 35) {
                rainBar.style.background = 'linear-gradient(90deg, #38bdf8, #eab308)';
            } else {
                rainBar.style.background = 'linear-gradient(90deg, #38bdf8, #0284c7)';
            }
        }
    </script>
</body>
</html>
